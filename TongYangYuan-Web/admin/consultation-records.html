<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>咨询记录管理 - 童康源管理后台</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="css/admin.css">
    <style>
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-bar select, .filter-bar input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .filter-bar button {
            padding: 8px 20px;
            background: var(--primary-color, #4CAF50);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .records-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .records-table th {
            background: #f5f5f5;
            padding: 12px 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
        }
        .records-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }
        .records-table tr:hover {
            background: #f9f9f9;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-badge.pending { background: #FFF3E0; color: #FF9800; }
        .status-badge.completed { background: #E8F5E9; color: #4CAF50; }
        .status-badge.cancelled { background: #FFEBEE; color: #F44336; }
        
        .action-btns {
            display: flex;
            gap: 8px;
        }
        .action-btns button {
            padding: 5px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-view { background: #E3F2FD; color: #2196F3; }
        .btn-pdf { background: #FFF3E0; color: #FF9800; }
        .btn-signature { background: #F3E5F5; color: #9C27B0; }
        
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }
        .pagination button {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
        }
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .pagination span {
            color: #666;
        }
        
        /* PDF Modal */
        .pdf-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .pdf-modal-overlay.show { display: flex; }
        .pdf-modal {
            background: white;
            border-radius: 12px;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            overflow: hidden;
        }
        .pdf-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
        }
        .pdf-modal-header h3 { margin: 0; font-size: 16px; }
        .pdf-modal-body {
            height: 600px;
            overflow: hidden;
        }
        .pdf-iframe { width: 100%; height: 100%; border: none; }
        .close-modal {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }
        
        .loading { text-align: center; padding: 40px; color: #999; }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="logo" style="display: flex; align-items: center; gap: 12px;">
                <img src="../images/tongkangyuan.png" alt="Logo" style="width: 60px; height: 60px; object-fit: cover; border-radius: 10px;">
                <h2>童康源管理后台</h2>
            </div>
                        <nav class="nav-menu">
                <a href="index.html" class="nav-item">
                    <span class="icon">📊</span>
                    <span>数据概览</span>
                </a>
                <a href="users.html" class="nav-item">
                    <span class="icon">👥</span>
                    <span>用户管理</span>
                </a>
                <a href="consultants.html" class="nav-item">
                    <span class="icon">👨‍⚕️</span>
                    <span>咨询师管理</span>
                </a>
                <a href="tags.html" class="nav-item">
                    <span class="icon">🏷️</span>
                    <span>标签管理</span>
                </a>
                <a href="learning.html" class="nav-item">
                    <span class="icon">📚</span>
                    <span>学习资源</span>
                </a>
                <a href="appointments.html" class="nav-item">
                    <span class="icon">📅</span>
                    <span>预约管理</span>
                </a>
                <a href="consultation-records.html" class="nav-item active">
                    <span class="icon">📝</span>
                    <span>咨询记录</span>
                </a>
                <a href="statistics.html" class="nav-item">
                    <span class="icon">📈</span>
                    <span>数据统计</span>
                </a>
                <a href="home-config.html" class="nav-item">
                    <span class="icon">🏠</span>
                    <span>首页配置</span>
                </a>
                <a href="#" class="nav-item" id="logoutBtn">
                    <span class="icon">🚪</span>
                    <span>退出登录</span>
                </a>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 顶部栏 -->
            <header class="top-bar">
                <div class="breadcrumb">
                    <span>首页</span>
                    <span class="separator">/</span>
                    <span>咨询记录管理</span>
                </div>
                <div class="user-info">
                    <span id="adminName">管理员</span>
                    <span class="badge">ADMIN</span>
                </div>
            </header>

            <!-- 内容区 -->
            <div class="content-wrapper">
                <div class="page-header">
                    <h2>咨询记录管理</h2>
                    <div>
                        <button class="btn" onclick="exportRecords()" style="background: #2196F3; color: white; margin-right: 10px;">
                            📥 导出记录
                        </button>
                        <button class="btn" onclick="refreshRecords()" style="background: #4CAF50; color: white;">
                            🔄 刷新
                        </button>
                    </div>
                </div>

                <!-- 筛选栏 -->
                <div class="filter-bar">
                    <select id="statusFilter">
                        <option value="">全部状态</option>
                        <option value="PENDING">待完成</option>
                        <option value="COMPLETED">已完成</option>
                        <option value="CANCELLED">已取消</option>
                    </select>
                    <select id="consultantFilter">
                        <option value="">全部咨询师</option>
                    </select>
                    <input type="date" id="startDate" placeholder="开始日期">
                    <input type="date" id="endDate" placeholder="结束日期">
                    <input type="text" id="searchKeyword" placeholder="搜索用户/咨询师..." style="width: 200px;">
                    <button onclick="loadRecords()">筛选</button>
                    <button onclick="clearFilters()" style="background: #9E9E9E;">清除</button>
                </div>

                <!-- 记录列表 -->
                <table class="records-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>预约编号</th>
                            <th>咨询师</th>
                            <th>用户</th>
                            <th>咨询类型</th>
                            <th>咨询日期</th>
                            <th>状态</th>
                            <th>签名状态</th>
                            <th>PDF</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="recordsTableBody">
                        <tr>
                            <td colspan="10" class="loading">加载中...</td>
                        </tr>
                    </tbody>
                </table>

                <!-- 分页 -->
                <div class="pagination" id="pagination">
                    <button id="prevPage" onclick="prevPage()" disabled>上一页</button>
                    <span id="pageInfo">第 1 页，共 1 页</span>
                    <button id="nextPage" onclick="nextPage()" disabled>下一页</button>
                </div>
            </div>
        </main>
    </div>

    <!-- PDF预览弹窗 -->
    <div class="pdf-modal-overlay" id="pdfModal">
        <div class="pdf-modal">
            <div class="pdf-modal-header">
                <h3>📄 咨询记录PDF报告</h3>
                <button class="close-modal" onclick="closePdfModal()">&times;</button>
            </div>
            <div class="pdf-modal-body">
                <iframe id="pdfIframe" class="pdf-iframe"></iframe>
            </div>
        </div>
    </div>

    <script src="js/admin-common.js"></script>
    <script src="js/admin-consultation-records.js"></script>
</body>
</html>
