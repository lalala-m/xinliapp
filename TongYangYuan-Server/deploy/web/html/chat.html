<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>咨询对话 - 童康源咨询师端</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="css/anti-flicker.css">
</head>
<body>
    <!-- 通话状态通知容器 -->
    <div class="call-notification-container" id="callNotificationContainer"></div>

    <div class="chat-container">
        <!-- 聊天头部 -->
        <header class="chat-header">
            <div class="chat-header-left">
                <button class="back-btn" onclick="Chat.goBack()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 18l-6-6 6-6"/>
                    </svg>
                </button>
                <div class="avatar" id="clientAvatar">王</div>
                <div class="chat-client-info">
                    <div class="chat-client-name" id="clientName">王女士</div>
                    <div class="chat-client-child" id="clientChild">孩子：小明（8岁）</div>
                    <div class="peer-status offline" id="peerStatus"><span class="status-dot offline"></span>对方未在线</div>
                </div>
            </div>
            <div class="chat-header-actions">
                <button class="btn btn-outline" onclick="Chat.startAudioCall()">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 2h3a2 2 0 0 1 2 1.72"/>
                    </svg>
                    语音
                </button>
                <button class="btn btn-outline" onclick="Chat.startVideoCall()">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="23 7 16 12 23 17 23 7"/>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                    </svg>
                    视频
                </button>
                <button class="btn btn-danger-outline" id="endConsultationBtn" onclick="Chat.endConsultation()">
                    结束咨询
                </button>
            </div>
        </header>

        <!-- 消息区域 -->
        <div class="messages-area" id="messagesArea">
            <!-- 消息动态加载 -->
        </div>

        <!-- 输入区域 -->
        <div class="input-area" id="inputArea">
            <div class="input-container">
                <div class="input-actions">
                    <button class="action-btn" id="voiceBtn" onclick="Chat.toggleInputMode()" title="语音">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                            <line x1="12" y1="19" x2="12" y2="23"/>
                            <line x1="8" y1="23" x2="16" y2="23"/>
                        </svg>
                    </button>
                    <button class="action-btn" onclick="Chat.attachFile()" title="发送图片" id="attachBtn">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <polyline points="21 15 16 10 5 21"/>
                        </svg>
                    </button>
                </div>
                <div class="input-field-wrapper" id="textInputWrapper">
                    <textarea
                        class="message-input"
                        id="messageInput"
                        placeholder="输入消息..."
                        rows="1"
                        oninput="Chat.autoResize(this)"
                    ></textarea>
                </div>
                <!-- 语音按钮区域 -->
                <div class="voice-input-wrapper" id="voiceInputWrapper" style="display:none;">
                    <button class="voice-hold-btn" 
                            id="voiceHoldBtn"
                            onmousedown="Chat.startVoiceRecording(event)"
                            onmouseup="Chat.endVoiceRecording(event)"
                            onmouseleave="Chat.cancelVoiceRecording(event)"
                            ontouchstart="Chat.startVoiceRecording(event)"
                            ontouchend="Chat.endVoiceRecording(event)"
                            ontouchcancel="Chat.cancelVoiceRecording(event)">
                        <span id="voiceBtnText">按住 说话</span>
                    </button>
                </div>
                <button class="btn btn-primary send-btn" id="sendBtn" onclick="Chat.sendMessage()">
                    发送
                </button>
            </div>
        </div>

        <!-- 取消发送提示 -->
        <div class="voice-cancel-hint" id="voiceCancelHint">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
            <span>松开手指，取消发送</span>
        </div>
    </div>

    <!-- 媒体预览弹窗 -->
    <div class="media-preview-modal" id="mediaPreview" onclick="Chat.closeMediaPreview()">
        <button class="preview-close-btn" onclick="Chat.closeMediaPreview()">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </button>
        <img id="previewImage" src="" alt="预览">
    </div>

    <!-- 咨询总结与签名弹窗 -->
    <div class="summary-modal-overlay" id="summaryModalOverlay" style="display:none;">
        <div class="summary-modal">
            <h3>结束咨询 - 填写总结并签名确认</h3>
            <div class="summary-form">
                <label>本次咨询主题/问题总结 <span class="required">*</span></label>
                <textarea id="summaryText" rows="3" placeholder="请简要描述本次咨询的核心问题与处理情况..."></textarea>

                <label>咨询师反馈/建议 <span class="required">*</span></label>
                <textarea id="feedbackText" rows="3" placeholder="请填写给家长的反馈或后续建议..."></textarea>

                <label>核心困扰标签（逗号分隔）</label>
                <input type="text" id="issueTags" placeholder="例如：学习焦虑, 亲子沟通, 注意力缺陷">

                <label>电子签名 <span class="required">*</span></label>
                <div class="signature-box">
                    <canvas id="signatureCanvas" width="400" height="150"></canvas>
                </div>
                <div class="signature-actions">
                    <button type="button" class="btn btn-outline" onclick="Chat.clearSignature()">清除签名</button>
                </div>
            </div>
            <div class="summary-modal-actions">
                <button class="btn btn-outline" onclick="Chat.closeSummaryModal()">取消</button>
                <button class="btn btn-primary" id="submitSummaryBtn" onclick="Chat.submitConsultationSummary()">确认结束并签名</button>
            </div>
        </div>
    </div>

    <!-- PDF预览弹窗 -->
    <div class="pdf-preview-modal-overlay" id="pdfPreviewModal" style="display:none;">
        <div class="pdf-preview-modal">
            <div class="pdf-preview-header">
                <h3>咨询记录PDF</h3>
                <div class="pdf-preview-actions">
                    <button class="btn btn-outline" id="downloadPdfBtn" onclick="Chat.downloadPdf()">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        下载
                    </button>
                    <button class="preview-close-btn" onclick="Chat.closePdfPreview()">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="pdf-preview-content" id="pdfPreviewContent">
                <div class="pdf-loading" id="pdfLoading">
                    <div class="loading-spinner"></div>
                    <span>正在加载PDF...</span>
                </div>
                <iframe id="pdfIframe" style="display:none; width:100%; height:100%; border:none;"></iframe>
            </div>
        </div>
    </div>
        </div>
    <style>
        .summary-modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .summary-modal {
            background: white; border-radius: 16px; width: 100%; max-width: 520px;
            max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: 0 24px 48px rgba(0,0,0,0.2);
        }
        .summary-modal h3 { margin: 0 0 16px; font-size: 18px; color: #1E2A3B; }
        .summary-form label { display: block; margin: 12px 0 6px; font-size: 14px; font-weight: 500; color: #333; }
        .summary-form .required { color: #E53935; }
        .summary-form textarea, .summary-form input {
            width: 100%; padding: 10px 12px; border: 1px solid #E0E0E0; border-radius: 10px;
            font-size: 14px; box-sizing: border-box; resize: vertical;
        }
        .signature-box {
            border: 1px dashed #BDBDBD; border-radius: 10px; background: #FAFAFA;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        #signatureCanvas { display: block; cursor: crosshair; background: #fff; max-width: 100%; }
        .signature-actions { margin-top: 8px; text-align: right; }
        .summary-modal-actions {
            display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; padding-top: 16px; border-top: 1px solid #F0F0F0;
        }
        /* PDF Preview Modal */
        .pdf-preview-modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2000;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .pdf-preview-modal {
            background: white; border-radius: 16px; width: 100%; max-width: 900px;
            max-height: 90vh; display: flex; flex-direction: column;
            box-shadow: 0 24px 48px rgba(0,0,0,0.3);
        }
        .pdf-preview-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; border-bottom: 1px solid #F0F0F0;
        }
        .pdf-preview-header h3 { margin: 0; font-size: 18px; color: #1E2A3B; }
        .pdf-preview-actions { display: flex; gap: 10px; align-items: center; }
        .pdf-preview-content { flex: 1; min-height: 0; overflow: hidden; }
        .pdf-loading {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; min-height: 400px; color: #666;
        }
        .loading-spinner {
            width: 40px; height: 40px; border: 3px solid #E0E0E0; border-top-color: #4A90D9;
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .preview-close-btn {
            background: none; border: none; cursor: pointer; padding: 8px;
            color: #666; border-radius: 8px;
        }
        .preview-close-btn:hover { background: #F5F5F5; color: #333; }
    </style>

    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/mock-data.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    
    <!-- WebSocket Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    
    <script src="js/chat.js"></script>
</body>
</html>
