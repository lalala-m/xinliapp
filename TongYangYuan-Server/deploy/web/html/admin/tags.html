<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标签管理 - 童康源管理后台</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="css/admin.css">
    <style>
        .tags-layout {
            display: flex;
            gap: 20px;
            height: calc(100vh - 140px);
        }
        .stage-panel {
            width: 280px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .stage-panel-header {
            padding: 16px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stage-panel-header h3 {
            margin: 0;
            font-size: 16px;
        }
        .stage-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .stage-item {
            padding: 12px 14px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            margin-bottom: 4px;
        }
        .stage-item:hover {
            background: #f5f7fa;
        }
        .stage-item.active {
            background: #e8f1fa;
            color: #4A90D9;
            font-weight: 600;
        }
        .stage-item .stage-icon {
            font-size: 20px;
        }
        .stage-item .stage-name {
            flex: 1;
            font-size: 14px;
        }
        .stage-item .stage-count {
            font-size: 12px;
            color: #999;
            background: #f0f0f0;
            padding: 2px 8px;
            border-radius: 10px;
        }
        .stage-item.active .stage-count {
            background: rgba(74,144,217,0.15);
            color: #4A90D9;
        }
        .issues-panel {
            flex: 1;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .issues-panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .issues-panel-header h3 {
            margin: 0;
            font-size: 16px;
        }
        .issues-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }
        .category-group {
            margin-bottom: 20px;
            border: 1px solid #e8e8e8;
            border-radius: 10px;
            overflow: hidden;
        }
        .category-header {
            background: #f8f9fa;
            padding: 12px 16px;
            font-weight: 600;
            font-size: 14px;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .category-issues {
            padding: 12px 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .issue-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: #f0f4f8;
            border-radius: 16px;
            font-size: 13px;
            color: #555;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .issue-tag:hover {
            border-color: #4A90D9;
            background: #e8f1fa;
        }
        .issue-tag.custom {
            background: #fff3e0;
            color: #e65100;
        }
        .issue-tag .delete-btn {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(0,0,0,0.1);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #666;
            padding: 0;
            line-height: 1;
        }
        .issue-tag .delete-btn:hover {
            background: #f44336;
            color: white;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 13px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary-sm {
            background: #4A90D9;
            color: white;
        }
        .btn-primary-sm:hover {
            background: #3a7bc8;
        }
        .btn-danger-sm {
            background: #f44336;
            color: white;
        }
        .btn-danger-sm:hover {
            background: #d32f2f;
        }
        .btn-success-sm {
            background: #4CAF50;
            color: white;
        }
        .form-inline {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .form-inline input, .form-inline select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
        }
        .modal-body .form-group {
            margin-bottom: 16px;
        }
        .modal-body .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
        }
        .modal-body .form-group input,
        .modal-body .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="logo" style="display: flex; align-items: center; gap: 12px;">
                <img src="../images/tongkangyuan.png" alt="Logo" style="width: 60px; height: 60px; object-fit: cover; border-radius: 10px;">
                <h2>童康源管理后台</h2>
            </div>
                        <nav class="nav-menu">
                <a href="index.html" class="nav-item">
                    <span class="icon">📊</span>
                    <span>数据概览</span>
                </a>
                <a href="users.html" class="nav-item">
                    <span class="icon">👥</span>
                    <span>用户管理</span>
                </a>
                <a href="consultants.html" class="nav-item">
                    <span class="icon">👨‍⚕️</span>
                    <span>咨询师管理</span>
                </a>
                <a href="tags.html" class="nav-item active">
                    <span class="icon">🏷️</span>
                    <span>标签管理</span>
                </a>
                <a href="learning.html" class="nav-item">
                    <span class="icon">📚</span>
                    <span>学习资源</span>
                </a>
                <a href="appointments.html" class="nav-item">
                    <span class="icon">📅</span>
                    <span>预约管理</span>
                </a>
                <a href="consultation-records.html" class="nav-item">
                    <span class="icon">📝</span>
                    <span>咨询记录</span>
                </a>
                <a href="statistics.html" class="nav-item">
                    <span class="icon">📈</span>
                    <span>数据统计</span>
                </a>
                <a href="home-config.html" class="nav-item">
                    <span class="icon">🏠</span>
                    <span>首页配置</span>
                </a>
                <a href="#" class="nav-item" id="logoutBtn">
                    <span class="icon">🚪</span>
                    <span>退出登录</span>
                </a>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 顶部栏 -->
            <header class="top-bar">
                <div class="breadcrumb">
                    <span>首页</span>
                    <span class="separator">/</span>
                    <span>标签管理</span>
                </div>
                <div class="user-info">
                    <span id="adminName">管理员</span>
                    <span class="badge">ADMIN</span>
                </div>
            </header>

            <!-- 标签管理布局 -->
            <div class="tags-layout">
                <!-- 左侧：阶段列表 -->
                <div class="stage-panel">
                    <div class="stage-panel-header">
                        <h3>🏷️ 年龄/人生阶段</h3>
                        <button class="btn-sm btn-primary-sm" onclick="showAddStageModal()">+ 新增</button>
                    </div>
                    <div class="stage-list" id="stageList">
                        <!-- 动态加载 -->
                    </div>
                </div>

                <!-- 右侧：问题列表 -->
                <div class="issues-panel">
                    <div class="issues-panel-header">
                        <h3 id="issuesPanelTitle">📋 咨询问题标签</h3>
                        <div class="form-inline">
                            <button class="btn-sm btn-primary-sm" onclick="showAddIssueModal()">+ 添加问题</button>
                        </div>
                    </div>
                    <div class="issues-content" id="issuesContent">
                        <div class="empty-state">
                            <div class="icon">📋</div>
                            <p>请从左侧选择一个阶段查看问题标签</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 新增/编辑阶段模态框 -->
    <div id="stageModal" class="modal">
        <div class="modal-content" style="max-width: 450px;">
            <span class="close" onclick="closeStageModal()">&times;</span>
            <h2 id="stageModalTitle">新增阶段</h2>
            <div class="modal-body">
                <input type="hidden" id="stageId">
                <div class="form-group">
                    <label>阶段编码</label>
                    <input type="text" id="stageCode" placeholder="如: newborn, primary_school">
                </div>
                <div class="form-group">
                    <label>阶段名称</label>
                    <input type="text" id="stageName" placeholder="如: 0-1岁新生儿">
                </div>
                <div class="form-group">
                    <label>图标</label>
                    <input type="text" id="stageIcon" placeholder="如: 👶">
                </div>
                <div class="form-group">
                    <label>排序</label>
                    <input type="number" id="stageSort" value="0">
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeStageModal()">取消</button>
                <button class="btn-primary" onclick="saveStage()">保存</button>
            </div>
        </div>
    </div>

    <!-- 新增/编辑问题模态框 -->
    <div id="issueModal" class="modal">
        <div class="modal-content" style="max-width: 450px;">
            <span class="close" onclick="closeIssueModal()">&times;</span>
            <h2 id="issueModalTitle">添加问题</h2>
            <div class="modal-body">
                <input type="hidden" id="issueId">
                <div class="form-group">
                    <label>所属阶段</label>
                    <select id="issueStageId">
                        <!-- 动态加载 -->
                    </select>
                </div>
                <div class="form-group">
                    <label>问题分类</label>
                    <input type="text" id="issueCategory" placeholder="如: 饮食喂养类">
                </div>
                <div class="form-group">
                    <label>问题名称</label>
                    <input type="text" id="issueName" placeholder="如: 喂养抗拒">
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="issueIsCustom"> 是否为"其它"自定义输入项
                    </label>
                </div>
                <div class="form-group">
                    <label>排序</label>
                    <input type="number" id="issueSort" value="0">
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeIssueModal()">取消</button>
                <button class="btn-primary" onclick="saveIssue()">保存</button>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="js/admin-common.js"></script>
    <script src="js/admin-tags.js"></script>
</body>
</html>
