# 应用配置
spring.application.name=tongyangyuan-mental-health-server
spring.devtools.add-properties=false

# 服务器配置
# === 原服务器配置（保留）===
# 生产环境端口/地址保持不变
# ===========================
# 【本地测试配置】监听本机所有网卡，方便真机通过USB/WiFi访问
server.port=8080
server.address=0.0.0.0
server.servlet.context-path=/api

# 数据库配置（本地开发时使用 localhost）
spring.datasource.url=jdbc:mysql://localhost:3306/mental_health_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis配置（本地开发时使用 localhost）
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=Redis@2026
spring.data.redis.timeout=5000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-wait=-1ms
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# JPA配置
# validate: 只验证表结构，不修改（防止数据丢失）
# 如需修改表结构，临时改为 update，启动后再改回 validate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# 文件上传配置
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT配置
jwt.secret=TongYangYuanMentalHealthSecretKey2026VeryLongSecretKeyForJWTTokenGenerationThatIsLongEnoughForHS256
jwt.expiration=86400000

# WebSocket配置
websocket.allowed-origins=*

# 日志配置
logging.level.root=INFO
logging.level.com.tongyangyuan=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# CORS配置
cors.allowed-origins=http://localhost:3000,http://localhost:8081,http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:3000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# OpenIM Configuration（本地开发使用 localhost，端口映射在 docker-compose 中）
openim.api-url=http://localhost:10002
openim.ws-url=ws://localhost:10001
openim.admin-user-id=imAdmin
openim.secret=openIM123

# 对外暴露的地址（供客户端连接）
# 实际信令走的是 Spring Boot STOMP WebSocket
# 由于 server.servlet.context-path=/api，WebSocket 端点 /stomp 的实际路径是 /api/stomp
# 模拟器：用 adb reverse tcp:8080 tcp:8080 映射后使用 ws://127.0.0.1:8080/api/stomp
# 真机/局域网：用电脑局域网IP，如 ws://192.168.x.x:8080/api/stomp
# 生产：填服务器公网IP
# === 原服务器配置（保留）===
# openim.external-api-url=http://139.196.5.153:8080/api
# openim.external-ws-url=ws://139.196.5.153:8080/api/stomp
# openim.sdk-url=ws://139.196.5.153:8080/api/stomp
# ===========================
# 【本地测试配置】使用本机局域网IP（需根据实际情况修改，ipconfig查看）
# USB调试 + adb reverse 时手机用 127.0.0.1 访问，但后端返回的URL需要是电脑IP
openim.external-api-url=http://172.17.81.135:8080/api
openim.external-ws-url=ws://172.17.81.135:8080/api/stomp
openim.sdk-url=ws://172.17.81.135:8080/api/stomp

# 支付配置（沙箱模式）
payment.alipay.notify-url=http://localhost:8080/api/orders/callback
payment.wechat.notify-url=http://localhost:8080/api/orders/callback
payment.mode=sandbox

# 腾讯云短信服务配置
# 获取方式：https://console.cloud.tencent.com/cam/capi
# 请替换为实际的腾讯云密钥
tencent.sms.secret-id=YOUR_TENCENT_SECRET_ID
tencent.sms.secret-key=YOUR_TENCENT_SECRET_KEY
tencent.sms.app-id=1401122605
tencent.sms.sign-name=童康源
tencent.sms.template-id=2638951

# 邮件服务配置（QQ邮箱）
spring.mail.host=smtp.qq.com
spring.mail.port=587
spring.mail.username=2361185166@qq.com
spring.mail.password=njzijyevnvaudihb
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 测试配置
app.test-mode=true
app.server-url=http://localhost:8080

# 静态资源映射 - 使用相对路径，上传目录在应用运行目录下的 uploads/ 文件夹
# 这样无论部署到哪里，uploads/ 都跟随应用
spring.web.resources.static-locations=classpath:/static/,file:./uploads/
