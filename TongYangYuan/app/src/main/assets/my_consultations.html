<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的咨询</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .consultations-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .consultation-tab {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            background: white;
            border: none;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }

        .consultation-tab.active {
            background: linear-gradient(135deg, #6FA6F8 0%, #A9C9FF 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(111, 166, 248, 0.35);
        }

        .consultation-list {
            display: none;
        }

        .consultation-list.active {
            display: block;
        }

        .consultation-card {
            margin-bottom: 12px;
            padding: 16px;
            border-radius: 16px;
            background: white;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .consultation-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .consultation-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6FA6F8 0%, #A9C9FF 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .consultation-info {
            flex: 1;
        }

        .consultation-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .consultation-domain {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .consultation-status {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
        }

        .consultation-status.pending {
            background: rgba(255, 152, 0, 0.12);
            color: #E65100;
        }

        .consultation-status.confirmed {
            background: rgba(76, 175, 80, 0.12);
            color: #2E7D32;
        }

        .consultation-status.completed {
            background: rgba(33, 150, 243, 0.12);
            color: #1565C0;
        }

        .consultation-status.cancelled {
            background: rgba(158, 158, 158, 0.12);
            color: #616161;
        }

        .consultation-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
            padding: 12px;
            background: var(--surface);
            border-radius: 12px;
        }

        .consultation-detail-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .consultation-detail-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .consultation-detail-value {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .consultation-child {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            padding: 8px 12px;
            background: rgba(111, 166, 248, 0.08);
            border-radius: 10px;
        }

        .consultation-child-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6FA6F8 0%, #A9C9FF 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            font-weight: 600;
        }

        .consultation-child-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .consultation-child-age {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .consultation-actions {
            display: flex;
            gap: 8px;
        }

        .consultation-btn {
            flex: 1;
            padding: 10px 16px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .consultation-btn.primary {
            background: linear-gradient(135deg, #6FA6F8 0%, #A9C9FF 100%);
            color: white;
        }

        .consultation-btn.secondary {
            background: var(--surface);
            color: var(--text-secondary);
        }

        .consultation-empty {
            text-align: center;
            padding: 48px 24px;
        }

        .consultation-empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .consultation-empty h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .consultation-empty p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .consultation-empty-btn {
            padding: 12px 32px;
            background: linear-gradient(135deg, #6FA6F8 0%, #A9C9FF 100%);
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .loading-spinner {
            text-align: center;
            padding: 48px 24px;
            color: var(--text-secondary);
        }

        .loading-spinner::after {
            content: '';
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="top-app-bar glass">
        <button class="back-btn" onclick="goBack()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 18l-6-6 6-6"/>
            </svg>
        </button>
        <div class="title">我的咨询</div>
    </div>

    <div class="content">
        <!-- 标签切换 -->
        <div class="consultations-tabs">
            <button class="consultation-tab active" data-tab="all" onclick="switchTab('all')">全部</button>
            <button class="consultation-tab" data-tab="pending" onclick="switchTab('pending')">待确认</button>
            <button class="consultation-tab" data-tab="confirmed" onclick="switchTab('confirmed')">已确认</button>
            <button class="consultation-tab" data-tab="completed" onclick="switchTab('completed')">已完成</button>
        </div>

        <!-- 加载中 -->
        <div class="loading-spinner" id="loadingState">加载中...</div>

        <!-- 全部咨询 -->
        <div class="consultation-list active" id="list-all"></div>

        <!-- 待确认 -->
        <div class="consultation-list" id="list-pending"></div>

        <!-- 已确认 -->
        <div class="consultation-list" id="list-confirmed"></div>

        <!-- 已完成 -->
        <div class="consultation-list" id="list-completed"></div>

        <!-- 空状态 -->
        <div class="consultation-empty" id="emptyState" style="display: none;">
            <div class="consultation-empty-icon">📋</div>
            <h3>暂无咨询记录</h3>
            <p>您还没有预约过咨询师<br>快去预约一位专业咨询师吧</p>
            <button class="consultation-empty-btn" onclick="findConsultant()">查找咨询师</button>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        let allAppointments = [];

        // 页面加载时获取真实数据
        document.addEventListener('DOMContentLoaded', loadConsultations);

        function getApiBase() {
            if (window.Android && typeof Android.getBaseUrl === 'function') {
                try { return Android.getBaseUrl() || ''; } catch (e) {}
            }
            return (typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : 'http://127.0.0.1:8080/api');
        }

        function getToken() {
            if (window.Android && typeof Android.getAuthToken === 'function') {
                try { return Android.getAuthToken() || ''; } catch (e) {}
            }
            return '';
        }

        function getUserId() {
            if (window.Android && typeof Android.getUserId === 'function') {
                try { return Android.getUserId(); } catch (e) {}
            }
            return null;
        }

        async function loadConsultations() {
            document.getElementById('loadingState').style.display = 'block';
            document.getElementById('emptyState').style.display = 'none';

            try {
                const baseUrl = getApiBase();
                const token = getToken();
                const userId = getUserId();

                if (!userId) {
                    showToast('请先登录');
                    document.getElementById('loadingState').style.display = 'none';
                    document.getElementById('emptyState').style.display = 'block';
                    return;
                }

                const res = await fetch(`${baseUrl}/appointments/parent/${userId}`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const json = await res.json();

                document.getElementById('loadingState').style.display = 'none';

                if (json.code === 200 && json.data && json.data.length > 0) {
                    allAppointments = json.data;
                    renderAllTabs();
                } else {
                    allAppointments = [];
                    document.getElementById('emptyState').style.display = 'block';
                }
            } catch (e) {
                console.error('加载咨询记录失败:', e);
                document.getElementById('loadingState').style.display = 'none';
                showToast('加载失败，请稍后重试');
            }
        }

        function renderAllTabs() {
            renderList('list-all', allAppointments);
            renderList('list-pending', allAppointments.filter(a => a.status === 'PENDING'));
            renderList('list-confirmed', allAppointments.filter(a => a.status === 'CONFIRMED'));
            renderList('list-completed', allAppointments.filter(a => a.status === 'COMPLETED'));
        }

        function renderList(containerId, appointments) {
            const container = document.getElementById(containerId);
            if (appointments.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:32px;color:#999;">该分类下暂无记录</div>';
                return;
            }
            container.innerHTML = appointments.map(apt => `
                <div class="consultation-card">
                    <div class="consultation-header">
                        <div class="consultation-avatar">${apt.consultantName ? apt.consultantName.charAt(0) : '咨'}</div>
                        <div class="consultation-info">
                            <div class="consultation-name">${apt.consultantName || '咨询师'}</div>
                            <div class="consultation-domain">${apt.domain || '心理咨询'}</div>
                        </div>
                        <span class="consultation-status ${(apt.status || 'PENDING').toLowerCase()}">${getStatusText(apt.status)}</span>
                    </div>
                    <div class="consultation-details">
                        <div class="consultation-detail-item">
                            <span class="consultation-detail-label">预约日期</span>
                            <span class="consultation-detail-value">${apt.appointmentDate || '-'}</span>
                        </div>
                        <div class="consultation-detail-item">
                            <span class="consultation-detail-label">预约时段</span>
                            <span class="consultation-detail-value">${apt.timeSlot || '-'}</span>
                        </div>
                    </div>
                    <div class="consultation-child">
                        <div class="consultation-child-avatar">${apt.childName ? apt.childName.charAt(0) : '孩'}</div>
                        <div>
                            <div class="consultation-child-name">${apt.childName || '孩子'}</div>
                            <div class="consultation-child-age">${apt.childAge ? apt.childAge + '岁' : ''}</div>
                        </div>
                    </div>
                    <div class="consultation-actions">
                        ${getActionButtons(apt)}
                    </div>
                </div>
            `).join('');
        }

        function getActionButtons(apt) {
            const status = apt.status || 'PENDING';
            if (status === 'COMPLETED') {
                return `
                    <button class="consultation-btn primary" onclick="viewConsultationRecord('${apt.id}')">查看记录</button>
                    <button class="consultation-btn secondary" onclick="rebookConsultant('${apt.id}')">再次预约</button>
                `;
            } else if (status === 'CONFIRMED') {
                return `
                    <button class="consultation-btn primary" onclick="openChat('${apt.id}')">进入咨询</button>
                    <button class="consultation-btn secondary" onclick="viewDetail('${apt.id}')">查看详情</button>
                `;
            } else if (status === 'PENDING') {
                return `
                    <button class="consultation-btn secondary" onclick="cancelAppointment('${apt.id}')">取消预约</button>
                    <button class="consultation-btn secondary" onclick="viewDetail('${apt.id}')">查看详情</button>
                `;
            }
            return `<button class="consultation-btn secondary" onclick="viewDetail('${apt.id}')">查看详情</button>`;
        }

        function getStatusText(status) {
            const map = {
                'PENDING': '待确认',
                'CONFIRMED': '已确认',
                'COMPLETED': '已完成',
                'CANCELLED': '已取消'
            };
            return map[status] || status;
        }

        // 标签切换
        function switchTab(tab) {
            document.querySelectorAll('.consultation-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');

            document.querySelectorAll('.consultation-list').forEach(list => list.classList.remove('active'));
            document.getElementById('list-' + tab).classList.add('active');
        }

        // 进入咨询聊天
        function openChat(appointmentId) {
            if (window.Android && Android.navigateToChat) {
                Android.navigateToChat(appointmentId);
            } else {
                showToast('正在进入咨询...');
            }
        }

        // 查看详情
        function viewDetail(appointmentId) {
            viewConsultationRecord(appointmentId);
        }

        // 取消预约
        function cancelAppointment(appointmentId) {
            if (confirm('确定要取消这个预约吗？')) {
                if (window.Android && Android.cancelAppointment) {
                    Android.cancelAppointment(appointmentId);
                } else {
                    showToast('预约已取消');
                }
            }
        }

        // 查看咨询记录
        function viewConsultationRecord(appointmentId) {
            const detailUrl = `consultation-record-detail.html?appointmentId=${encodeURIComponent(appointmentId || '')}`;
            if (window.Android && typeof Android.openWebPage === 'function') {
                Android.openWebPage(detailUrl);
            } else {
                window.location.href = detailUrl;
            }
        }

        // 查找咨询师
        function findConsultant() {
            if (window.Android && typeof Android.navigateToConsultantList === 'function') {
                Android.navigateToConsultantList();
            } else if (window.Android && typeof Android.openWebPage === 'function') {
                Android.openWebPage('consult.html');
            } else {
                window.location.href = 'consult.html';
            }
        }

        // 再次预约
        function rebookConsultant(appointmentId) {
            if (window.Android && Android.rebookConsultant) {
                Android.rebookConsultant(appointmentId);
            } else {
                showToast('正在跳转预约页面...');
            }
        }

        function goBack() {
            if (window.Android && Android.goBack) {
                Android.goBack();
            } else {
                window.history.back();
            }
        }

        function showToast(message) {
            if (window.Android && Android.showToast) {
                Android.showToast(message);
            } else {
                alert(message);
            }
        }
    </script>
</body>
</html>
