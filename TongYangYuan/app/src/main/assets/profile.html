<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #EDEDED;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* 顶部用户信息 */
        .user-header {
            background: #fff;
            padding: 20px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 10px;
        }
        .user-avatar {
            width: 64px;
            height: 64px;
            border-radius: 6px;
            background: #6FA6F8;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 28px;
            font-weight: 600;
            flex-shrink: 0;
        }
        .user-info {
            flex: 1;
        }
        .user-name {
            font-size: 20px;
            font-weight: 600;
            color: #000;
            margin-bottom: 6px;
        }
        .user-phone {
            font-size: 14px;
            color: #999;
        }
        .user-arrow {
            width: 20px;
            height: 20px;
            color: #C8C8C8;
        }

        /* 列表分组 */
        .list-group {
            background: #fff;
            margin-bottom: 10px;
        }
        .list-item {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid #F5F5F5;
            cursor: pointer;
            transition: background 0.15s;
        }
        .list-item:last-child {
            border-bottom: none;
        }
        .list-item:active {
            background: #F5F5F5;
        }
        .list-icon {
            width: 24px;
            height: 24px;
            margin-right: 12px;
            color: #6FA6F8;
            flex-shrink: 0;
        }
        .list-text {
            flex: 1;
            font-size: 16px;
            color: #333;
        }
        .list-extra {
            font-size: 14px;
            color: #999;
            margin-right: 4px;
        }
        .list-arrow {
            width: 16px;
            height: 16px;
            color: #C8C8C8;
            flex-shrink: 0;
        }

        /* 状态标签 */
        .status-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            margin-left: 8px;
        }
        .status-tag.vip {
            background: #FFF3E0;
            color: #FF9800;
        }
        .status-tag.normal {
            background: #F5F5F5;
            color: #999;
        }

        /* 底部导航 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #F7F7F7;
            border-top: 1px solid #E5E5E5;
            display: flex;
            justify-content: space-around;
            padding: 6px 0;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            padding: 4px 20px;
        }
        .nav-item.active .nav-icon { color: #07C160; }
        .nav-item.active .nav-label { color: #07C160; }
        .nav-icon {
            width: 24px;
            height: 24px;
            color: #999;
        }
        .nav-label {
            font-size: 11px;
            color: #999;
        }
    </style>
</head>
<body>
    <!-- 用户信息 -->
    <div class="user-header" onclick="openProfileEdit()">
        <div class="user-avatar" id="userAvatar">访</div>
        <div class="user-info">
            <div class="user-name" id="userName">访客</div>
            <div class="user-phone" id="userPhone">点击登录</div>
        </div>
        <svg class="user-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 6l6 6-6 6"/>
        </svg>
    </div>

    <!-- 会员状态 -->
    <div class="list-group">
        <div class="list-item" onclick="openRechargePage()">
            <svg class="list-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"/>
            </svg>
            <span class="list-text">会员中心</span>
            <span class="list-extra" id="memberExtra">未开通</span>
            <svg class="list-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 6l6 6-6 6"/>
            </svg>
        </div>
    </div>

    <!-- 孩子档案 -->
    <div class="list-group">
        <div class="list-item" onclick="openChildManagement()">
            <svg class="list-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2a5 5 0 0 1 5 5v2a5 5 0 0 1-10 0V7a5 5 0 0 1 5-5z"/>
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            </svg>
            <span class="list-text">孩子档案</span>
            <span class="list-extra" id="childExtra">未完善</span>
            <svg class="list-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 6l6 6-6 6"/>
            </svg>
        </div>
        <div class="list-item" onclick="navigateToPage('my_consultations.html')">
            <svg class="list-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
            </svg>
            <span class="list-text">我的咨询</span>
            <svg class="list-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 6l6 6-6 6"/>
            </svg>
        </div>
    </div>

    <!-- 账号相关 -->
    <div class="list-group">
        <div class="list-item" onclick="openAccountManagement()">
            <svg class="list-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
            <span class="list-text">账号管理</span>
            <svg class="list-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 6l6 6-6 6"/>
            </svg>
        </div>
        <div class="list-item" onclick="openConsultantLogin()" id="consultantEntry">
            <svg class="list-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
            <span class="list-text">咨询师入口</span>
            <svg class="list-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 6l6 6-6 6"/>
            </svg>
        </div>
    </div>

    <!-- 底部导航 -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="goHome()">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span class="nav-label">首页</span>
        </div>
        <div class="nav-item" onclick="goConsult()">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
            </svg>
            <span class="nav-label">咨询</span>
        </div>
        <div class="nav-item active" onclick="goProfile()">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
            <span class="nav-label">我的</span>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadUserProfile();
        });

        function loadUserProfile() {
            const profile = window.getUserProfile ? window.getUserProfile() : {};
            
            if (profile.isLoggedIn) {
                document.getElementById('userName').textContent = profile.nickname || profile.phone || '用户';
                document.getElementById('userPhone').textContent = profile.phone || '';
                document.getElementById('userAvatar').textContent = (profile.nickname || profile.phone || '用').charAt(0);
                
                // 会员状态
                const memberExtra = document.getElementById('memberExtra');
                if (profile.isPaid) {
                    memberExtra.textContent = '已开通';
                    memberExtra.style.color = '#FF9800';
                } else {
                    memberExtra.textContent = '未开通';
                }
                
                // 孩子状态
                const childExtra = document.getElementById('childExtra');
                if (profile.hasChildProfile) {
                    childExtra.textContent = '已完善';
                    childExtra.style.color = '#07C160';
                } else {
                    childExtra.textContent = '未完善';
                }
            } else {
                document.getElementById('userName').textContent = '访客';
                document.getElementById('userPhone').textContent = '点击登录';
                document.getElementById('userAvatar').textContent = '访';
            }
        }

        function openProfileEdit() {
            const profile = window.getUserProfile ? window.getUserProfile() : {};
            if (!profile.isLoggedIn) {
                window.location.href = 'auth.html';
                return;
            }
            // 已登录，可以编辑资料
            showToast('资料编辑功能开发中');
        }

        function openAccountManagement() {
            navigateToPage('account_management.html');
        }

        function openChildManagement() {
            navigateToPage('child_management.html');
        }

        function openRechargePage() {
            navigateToPage('wallet_recharge.html');
        }

        function openConsultantLogin() {
            if (window.Android && Android.openConsultantLogin) {
                Android.openConsultantLogin();
            } else {
                navigateToPage('consultant_login.html');
            }
        }

        function goHome() {
            navigateToPage('home.html');
        }

        function goConsult() {
            navigateToPage('consult.html');
        }

        function goProfile() {
            // 已在当前页
        }

        function navigateToPage(page) {
            if (window.Android && Android.openWebPage) {
                Android.openWebPage(page);
            } else {
                window.location.href = page;
            }
        }

        function showToast(message) {
            if (window.Android && Android.showToast) {
                Android.showToast(message);
            } else {
                // 简单的 toast 实现
                const toast = document.createElement('div');
                toast.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);color:#fff;padding:10px 20px;border-radius:4px;font-size:14px;z-index:9999;';
                toast.textContent = message;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2000);
            }
        }
    </script>
</body>
</html>
