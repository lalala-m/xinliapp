<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>咨询指导</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --primary: #4A90D9;
            --primary-light: #E8F1FA;
            --primary-gradient: linear-gradient(135deg, #4A90D9 0%, #6BA3E0 100%);
            --bg: #F5F7FA;
            --surface: #FFFFFF;
            --text-main: #1A1A2E;
            --text-secondary: #5A5A7A;
            --text-muted: #9CA3AF;
            --border: #E5E7EB;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(74,144,217,0.15);
            --radius-sm: 12px;
            --radius-md: 16px;
            --radius-lg: 20px;
            --sidebar-width: 110px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            max-width: 520px;
            margin: 0 auto;
            overflow-x: hidden;
            min-height: 100vh;
            padding-bottom: 100px;
        }

        /* ===== Header ===== */
        .header {
            background: var(--surface);
            padding: 16px 20px;
            padding-top: calc(16px + env(safe-area-inset-top));
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .back-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: var(--bg);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .back-btn:active {
            transform: scale(0.92);
            background: var(--primary-light);
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
            color: var(--text-main);
        }

        .header-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-main);
        }

        /* ===== Hero ===== */
        .hero {
            background: var(--primary-gradient);
            margin: 12px 16px 0;
            border-radius: var(--radius-lg);
            padding: 18px 16px;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .hero-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
            position: relative;
            z-index: 1;
        }

        .hero-subtitle {
            font-size: 12px;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        /* ===== Two-Column Layout ===== */
        .two-column {
            display: flex;
            height: calc(100vh - 180px);
            min-height: 400px;
            margin-top: 12px;
        }

        /* ===== Sidebar (Left) ===== */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--surface);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            flex-shrink: 0;
            -webkit-overflow-scrolling: touch;
        }

        .sidebar-item {
            padding: 14px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            position: relative;
        }

        .sidebar-item:active {
            background: var(--bg);
        }

        .sidebar-item.active {
            background: var(--primary-light);
            border-left-color: var(--primary);
        }

        .sidebar-item.active .sidebar-icon,
        .sidebar-item.active .sidebar-name {
            color: var(--primary);
        }

        .sidebar-icon {
            font-size: 24px;
            line-height: 1;
            margin-bottom: 4px;
            display: block;
        }

        .sidebar-name {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            line-height: 1.3;
            display: block;
        }

        /* ===== Content (Right) ===== */
        .content-area {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0 12px 20px;
        }

        .content-stage-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            padding: 16px 4px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .content-stage-title::before {
            content: '';
            width: 4px;
            height: 16px;
            background: var(--primary-gradient);
            border-radius: 2px;
        }

        /* ===== Category Groups ===== */
        .category-group {
            background: var(--surface);
            margin-bottom: 10px;
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .category-header-bar {
            background: linear-gradient(135deg, #f0f4f8 0%, #e8f1fa 100%);
            padding: 10px 14px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-issues-grid {
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .issue-chip {
            padding: 10px 8px;
            border-radius: 10px;
            background: var(--bg);
            border: 1.5px solid transparent;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            min-height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-all;
        }

        .issue-chip:active {
            transform: scale(0.96);
        }

        .issue-chip.selected {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 3px 10px rgba(74,144,217,0.35);
            border-color: transparent;
        }

        .issue-chip.custom {
            background: #fff3e0;
            color: #e65100;
            border: 1.5px dashed #ffb74d;
        }

        .issue-chip.custom.selected {
            background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
            color: white;
            border-color: transparent;
        }

        /* ===== Custom Input Modal ===== */
        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .custom-modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .custom-modal {
            background: white;
            border-radius: var(--radius-lg);
            padding: 24px;
            width: 100%;
            max-width: 400px;
            transform: scale(0.9);
            transition: all 0.3s;
        }

        .custom-modal-overlay.show .custom-modal {
            transform: scale(1);
        }

        .custom-modal h3 {
            margin-bottom: 16px;
            font-size: 17px;
        }

        .custom-modal input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 16px;
            outline: none;
        }

        .custom-modal input:focus {
            border-color: var(--primary);
        }

        .custom-modal-actions {
            display: flex;
            gap: 10px;
        }

        .custom-modal-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-cancel {
            background: var(--bg);
            color: var(--text-secondary);
        }

        .btn-confirm {
            background: var(--primary-gradient);
            color: white;
        }

        /* ===== Selected Summary ===== */
        .selected-summary {
            background: var(--surface);
            margin: 12px 4px;
            border-radius: var(--radius-md);
            padding: 12px 14px;
            box-shadow: var(--shadow-sm);
        }

        .selected-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .selected-tags-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .selected-tag-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 10px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
        }

        .selected-tag-remove {
            width: 15px;
            height: 15px;
            border: none;
            background: rgba(74,144,217,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 10px;
            color: var(--primary);
            padding: 0;
            line-height: 1;
        }

        /* ===== Bottom Bar ===== */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 520px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 12px 16px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
        }

        .bottom-info {
            flex: 1;
            min-width: 0;
        }

        .bottom-count {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .bottom-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .action-btn {
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            background: var(--primary-gradient);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 46px;
            white-space: nowrap;
            box-shadow: var(--shadow-md);
        }

        .action-btn:active {
            transform: scale(0.96);
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none;
            background: var(--border);
            color: var(--text-muted);
        }

        /* ===== Loading / Error ===== */
        .loading-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 16px;
            gap: 16px;
        }

        .loading-spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 16px;
            gap: 16px;
            text-align: center;
        }

        .retry-btn {
            padding: 10px 24px;
            border-radius: 999px;
            border: 1.5px solid var(--primary);
            background: transparent;
            color: var(--primary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            padding: 40px 16px;
            color: var(--text-muted);
        }

        .empty-state .emoji {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <button class="back-btn" onclick="goBack()" aria-label="返回">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 18l-6-6 6-6"/>
            </svg>
        </button>
        <h1 class="header-title">咨询指导</h1>
    </header>

    <!-- Hero -->
    <div class="hero">
        <div class="hero-title">您想咨询什么问题？</div>
        <div class="hero-subtitle">左侧选择阶段，右侧选择具体问题</div>
    </div>

    <!-- Main Content -->
    <main id="mainContent">
        <!-- Loading -->
        <div id="loadingState" class="loading-wrap">
            <div class="loading-spinner"></div>
            <p style="color: var(--text-muted); font-size: 14px;">正在加载...</p>
        </div>

        <!-- Error -->
        <div id="errorState" class="error-wrap hidden">
            <div style="font-size: 48px;">📡</div>
            <p style="color: var(--text-secondary); font-size: 14px;" id="errorText">加载失败，请检查网络</p>
            <button class="retry-btn" onclick="loadData()">重新加载</button>
        </div>

        <!-- Two Column Layout -->
        <div id="twoColumnLayout" class="two-column hidden">
            <!-- Left Sidebar: Stages -->
            <div class="sidebar" id="sidebar"></div>

            <!-- Right Content: Issues -->
            <div class="content-area" id="contentArea">
                <div class="content-stage-title" id="contentStageTitle"></div>
                <div id="issuesContainer"></div>

                <!-- Selected Summary -->
                <div class="selected-summary" id="selectedSummary" style="display: none;">
                    <div class="selected-label">已选择：</div>
                    <div class="selected-tags-list" id="selectedTagsList"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Custom Input Modal -->
    <div class="custom-modal-overlay" id="customModal">
        <div class="custom-modal">
            <h3>📝 自定义问题</h3>
            <input type="text" id="customInput" placeholder="请描述您的具体问题" maxlength="50">
            <div class="custom-modal-actions">
                <button class="btn-cancel" onclick="closeCustomModal()">取消</button>
                <button class="btn-confirm" onclick="confirmCustomInput()">确定</button>
            </div>
        </div>
    </div>

    <!-- Bottom Bar -->
    <div class="bottom-bar" id="bottomBar">
        <div class="bottom-info">
            <div class="bottom-count" id="bottomCount">请选择问题</div>
            <div class="bottom-hint" id="bottomHint">点击左侧阶段，右侧选择问题</div>
        </div>
        <button class="action-btn" id="actionBtn" onclick="goToConsultantList()" disabled>
            查看咨询师推荐
        </button>
    </div>

    <script src="js/app.js"></script>
    <script>
        (function() {
            'use strict';

            // ===== State =====
            let stages = [];
            let selectedStageId = null;
            let selectedIssues = new Map(); // key -> { id, name, category, stageId, stageName, isCustom }
            let currentCustomCategory = null;
            let customIssueCounter = 0;

            // ===== DOM =====
            const els = {
                loading: document.getElementById('loadingState'),
                error: document.getElementById('errorState'),
                errorText: document.getElementById('errorText'),
                twoColumn: document.getElementById('twoColumnLayout'),
                sidebar: document.getElementById('sidebar'),
                contentStageTitle: document.getElementById('contentStageTitle'),
                issuesContainer: document.getElementById('issuesContainer'),
                selectedSummary: document.getElementById('selectedSummary'),
                selectedTagsList: document.getElementById('selectedTagsList'),
                bottomCount: document.getElementById('bottomCount'),
                bottomHint: document.getElementById('bottomHint'),
                actionBtn: document.getElementById('actionBtn'),
                customModal: document.getElementById('customModal'),
                customInput: document.getElementById('customInput')
            };

            // ===== API =====
            async function fetchStages() {
                const response = await window.fetchWithAuth('/life-stages');
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const result = await response.json();
                if (result.code !== 200) throw new Error(result.message || '加载失败');
                return result.data || [];
            }

            // ===== Load =====
            window.loadData = async function() {
                showLoading();
                try {
                    const data = await fetchStages();
                    stages = (Array.isArray(data) && data.length > 0) ? data : getFallbackStages();
                    // 确保每个分类都有"其它"选项
                    ensureOtherOption(stages);
                    showLayout();
                } catch (err) {
                    console.error('加载失败:', err);
                    stages = getFallbackStages();
                    ensureOtherOption(stages);
                    showLayout();
                    if (window.showToast) window.showToast('网络异常，使用默认数据');
                }
            };

            // 确保每个分类最后都有"其它"自定义输入选项
            function ensureOtherOption(stagesList) {
                stagesList.forEach(stage => {
                    const issues = stage.issues || [];
                    // 按分类分组
                    const grouped = {};
                    issues.forEach(issue => {
                        const cat = issue.categoryName || '未分类';
                        if (!grouped[cat]) grouped[cat] = [];
                        grouped[cat].push(issue);
                    });

                    // 为每个分类检查并添加"其它"
                    Object.keys(grouped).forEach(cat => {
                        const catIssues = grouped[cat];
                        const hasOther = catIssues.some(i => i.isCustomInput || i.issueName === '其它');
                        if (!hasOther) {
                            // 找到最大id再加1
                            const maxId = Math.max(...issues.map(i => i.id || 0), 0);
                            issues.push({
                                id: maxId + 1,
                                categoryName: cat,
                                issueName: '其它',
                                isCustomInput: true
                            });
                        }
                    });
                });
            }

            // ===== Fallback Data =====
            function getFallbackStages() {
                return [
                    { id: 1, code: 'newborn', name: '0-1岁', icon: '👶', issues: [
                        { id: 101, categoryName: '饮食喂养', issueName: '喂养抗拒', isCustomInput: false },
                        { id: 102, categoryName: '饮食喂养', issueName: '饮食习惯差', isCustomInput: false },
                        { id: 103, categoryName: '睡眠问题', issueName: '夜醒频繁', isCustomInput: false },
                        { id: 104, categoryName: '睡眠问题', issueName: '入睡困难', isCustomInput: false }
                    ]},
                    { id: 2, code: 'infant', name: '1-2岁', icon: '🍼', issues: [
                        { id: 201, categoryName: '行为发展', issueName: '脾气大', isCustomInput: false },
                        { id: 202, categoryName: '行为发展', issueName: '分离焦虑', isCustomInput: false }
                    ]},
                    { id: 3, code: 'kindergarten', name: '3-6岁', icon: '🧸', issues: [
                        { id: 301, categoryName: '入园适应', issueName: '入园哭闹', isCustomInput: false },
                        { id: 302, categoryName: '社交能力', issueName: '不合群', isCustomInput: false }
                    ]},
                    { id: 4, code: 'primary_school', name: '7-12岁', icon: '📚', issues: [
                        { id: 401, categoryName: '学习问题', issueName: '注意力不集中', isCustomInput: false },
                        { id: 402, categoryName: '学习问题', issueName: '作业拖拉', isCustomInput: false }
                    ]},
                    { id: 5, code: 'middle_high_school', name: '13-18岁', icon: '🎓', issues: [
                        { id: 501, categoryName: '学业压力', issueName: '考试焦虑', isCustomInput: false },
                        { id: 502, categoryName: '人际关系', issueName: '同伴冲突', isCustomInput: false }
                    ]},
                    { id: 6, code: 'college', name: '大学生', icon: '🏫', issues: [
                        { id: 601, categoryName: '学业规划', issueName: '专业迷茫', isCustomInput: false },
                        { id: 602, categoryName: '情感问题', issueName: '恋爱困扰', isCustomInput: false }
                    ]},
                    { id: 7, code: 'society', name: '步入社会', icon: '💼', issues: [
                        { id: 701, categoryName: '职场发展', issueName: '职业迷茫', isCustomInput: false },
                        { id: 702, categoryName: '职场发展', issueName: '工作压力', isCustomInput: false }
                    ]},
                    { id: 8, code: 'marriage', name: '婚前婚后', icon: '💑', issues: [
                        { id: 801, categoryName: '亲密关系', issueName: '沟通障碍', isCustomInput: false },
                        { id: 802, categoryName: '亲密关系', issueName: '信任危机', isCustomInput: false }
                    ]},
                    { id: 9, code: 'property_division', name: '分家财产', icon: '⚖️', issues: [
                        { id: 901, categoryName: '财产分割', issueName: '房产纠纷', isCustomInput: false },
                        { id: 902, categoryName: '财产分割', issueName: '债务问题', isCustomInput: false }
                    ]},
                    { id: 10, code: 'elderly_care', name: '养老赡养', icon: '👴', issues: [
                        { id: 1001, categoryName: '养老照护', issueName: '照护压力', isCustomInput: false },
                        { id: 1002, categoryName: '养老照护', issueName: '代际冲突', isCustomInput: false }
                    ]}
                ];
            }

            // ===== Render Layout =====
            function showLayout() {
                els.loading.classList.add('hidden');
                els.error.classList.add('hidden');
                els.twoColumn.classList.remove('hidden');
                renderSidebar();
                // 默认选中第一个
                if (stages.length > 0) {
                    selectStage(stages[0].id);
                }
            }

            function renderSidebar() {
                els.sidebar.innerHTML = stages.map(stage => `
                    <div class="sidebar-item" data-stage-id="${stage.id}" onclick="selectStage(${stage.id})">
                        <span class="sidebar-icon">${stage.icon || '🏷️'}</span>
                        <span class="sidebar-name">${escapeHtml(stage.name)}</span>
                    </div>
                `).join('');
            }

            window.selectStage = function(stageId) {
                selectedStageId = stageId;

                // Update sidebar active state
                document.querySelectorAll('.sidebar-item').forEach(item => {
                    item.classList.toggle('active', parseInt(item.dataset.stageId) === stageId);
                });

                const stage = stages.find(s => s.id === stageId);
                if (!stage) return;

                els.contentStageTitle.textContent = stage.name + ' - 咨询问题';
                renderIssues(stage);
            };

            function renderIssues(stage) {
                const issues = stage.issues || [];
                if (issues.length === 0) {
                    els.issuesContainer.innerHTML = `
                        <div class="empty-state">
                            <div class="emoji">📋</div>
                            <p>该阶段下暂无问题标签</p>
                        </div>
                    `;
                    return;
                }

                // 按分类分组
                const grouped = {};
                issues.forEach(issue => {
                    const cat = issue.categoryName || '未分类';
                    if (!grouped[cat]) grouped[cat] = [];
                    grouped[cat].push(issue);
                });

                // 排序：普通项在前，"其它"在最后
                const categories = Object.keys(grouped).sort((a, b) => {
                    if (a === '其它') return 1;
                    if (b === '其它') return -1;
                    return a.localeCompare(b, 'zh-CN');
                });

                els.issuesContainer.innerHTML = categories.map(category => {
                    const catIssues = grouped[category];
                    // 每个分类内：普通项在前，"其它"在最后
                    catIssues.sort((a, b) => {
                        if (a.isCustomInput || a.issueName === '其它') return 1;
                        if (b.isCustomInput || b.issueName === '其它') return -1;
                        return a.issueName.localeCompare(b.issueName, 'zh-CN');
                    });

                    return `
                        <div class="category-group">
                            <div class="category-header-bar">
                                <span>${escapeHtml(category)}</span>
                                <span style="font-size:11px;color:#999;">${catIssues.length} 个</span>
                            </div>
                            <div class="category-issues-grid">
                                ${catIssues.map(issue => {
                                    const key = makeIssueKey(stage.id, issue.id);
                                    const isSelected = selectedIssues.has(key);
                                    const isCustom = issue.isCustomInput || issue.issueName === '其它';
                                    return `
                                        <div class="issue-chip ${isSelected ? 'selected' : ''} ${isCustom ? 'custom' : ''}"
                                             data-issue-key="${key}"
                                             onclick="toggleIssue(${stage.id}, ${issue.id})">
                                            ${isCustom ? '✏️ ' : ''}${escapeHtml(issue.issueName)}
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                }).join('');
            }

            function makeIssueKey(stageId, issueId) {
                return stageId + '_' + issueId;
            }

            window.toggleIssue = function(stageId, issueId) {
                const stage = stages.find(s => s.id === stageId);
                if (!stage) return;

                const issue = (stage.issues || []).find(i => i.id === issueId);
                if (!issue) return;

                const key = makeIssueKey(stageId, issueId);
                const isCustom = issue.isCustomInput || issue.issueName === '其它';

                if (isCustom) {
                    // 自定义输入项
                    if (selectedIssues.has(key)) {
                        selectedIssues.delete(key);
                        updateIssueVisual(key);
                        updateSelectedSummary();
                        updateBottomBar();
                    } else {
                        currentCustomCategory = issue.categoryName;
                        // 临时保存stageId和issueId，确认后使用
                        window._pendingCustomKey = key;
                        window._pendingCustomStage = stage;
                        showCustomModal();
                    }
                } else {
                    // 普通选项
                    if (selectedIssues.has(key)) {
                        selectedIssues.delete(key);
                    } else {
                        selectedIssues.set(key, {
                            id: issueId,
                            name: issue.issueName,
                            category: issue.categoryName,
                            stageId: stageId,
                            stageName: stage.name,
                            isCustom: false
                        });
                    }
                    updateIssueVisual(key);
                    updateSelectedSummary();
                    updateBottomBar();
                }
            };

            function updateIssueVisual(key) {
                const chip = document.querySelector(`[data-issue-key="${key}"]`);
                if (chip) {
                    chip.classList.toggle('selected', selectedIssues.has(key));
                }
            }

            // ===== Custom Input Modal =====
            function showCustomModal() {
                els.customInput.value = '';
                els.customModal.classList.add('show');
                setTimeout(() => els.customInput.focus(), 100);
            }

            window.closeCustomModal = function() {
                els.customModal.classList.remove('show');
                currentCustomCategory = null;
                window._pendingCustomKey = null;
                window._pendingCustomStage = null;
            };

            window.confirmCustomInput = function() {
                const val = els.customInput.value.trim();
                if (!val) {
                    if (window.showToast) window.showToast('请输入问题描述');
                    return;
                }

                const key = window._pendingCustomKey;
                const stage = window._pendingCustomStage;
                if (!key || !stage) {
                    closeCustomModal();
                    return;
                }

                customIssueCounter++;
                selectedIssues.set(key, {
                    id: 'custom_' + customIssueCounter,
                    name: val,
                    category: currentCustomCategory || '自定义',
                    stageId: stage.id,
                    stageName: stage.name,
                    isCustom: true
                });

                closeCustomModal();
                updateIssueVisual(key);
                updateSelectedSummary();
                updateBottomBar();
            };

            // 回车确认
            els.customInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') confirmCustomInput();
            });

            // ===== Selected Summary =====
            function updateSelectedSummary() {
                if (selectedIssues.size === 0) {
                    els.selectedSummary.style.display = 'none';
                    return;
                }
                els.selectedSummary.style.display = 'block';
                els.selectedTagsList.innerHTML = Array.from(selectedIssues.values()).map(issue => `
                    <span class="selected-tag-item">
                        ${escapeHtml(issue.name)}
                        <button class="selected-tag-remove" onclick="removeIssue('${String(issue.id).replace(/'/g, "\\'")}', ${issue.stageId || 0})">×</button>
                    </span>
                `).join('');
            }

            window.removeIssue = function(issueId, stageId) {
                // 找到对应的key
                for (const [key, value] of selectedIssues) {
                    if (String(value.id) === String(issueId) && value.stageId === stageId) {
                        selectedIssues.delete(key);
                        // 如果当前显示的是这个stage，更新视觉
                        const currentStage = stages.find(s => s.id === selectedStageId);
                        if (currentStage && currentStage.id === stageId) {
                            updateIssueVisual(key);
                        }
                        break;
                    }
                }
                updateSelectedSummary();
                updateBottomBar();
            };

            // ===== Bottom Bar =====
            function updateBottomBar() {
                const count = selectedIssues.size;
                els.bottomCount.textContent = `已选择 ${count} 个问题`;
                if (count === 0) {
                    els.bottomHint.textContent = '请至少选择一个问题';
                    els.actionBtn.disabled = true;
                } else {
                    els.bottomHint.textContent = '可多选，也可自定义输入';
                    els.actionBtn.disabled = false;
                }
            }

            // ===== Navigation =====
            window.goBack = function() {
                if (window.history.length > 1) {
                    window.history.back();
                } else if (window.Android && Android.goBack) {
                    Android.goBack();
                }
            };

            window.goToConsultantList = function() {
                if (selectedIssues.size === 0) {
                    if (window.showToast) window.showToast('请至少选择一个问题');
                    return;
                }

                // 只传递人生阶段，不传递具体问题
                const selectedStageIds = Array.from(new Set(Array.from(selectedIssues.values()).map(i => i.stageId)));
                const stageCodes = selectedStageIds.map(sid => {
                    const s = stages.find(st => st.id === sid);
                    return s ? s.code : '';
                }).filter(Boolean).join(',');
                const stageNames = selectedStageIds.map(sid => {
                    const s = stages.find(st => st.id === sid);
                    return s ? s.name : '';
                }).filter(Boolean).join(',');

                const url = `consultant_list.html?stage=${encodeURIComponent(stageCodes)}&stageName=${encodeURIComponent(stageNames)}`;

                if (window.Android && typeof Android.openWebPage === 'function') {
                    try { Android.openWebPage(url); }
                    catch (e) { window.location.href = url; }
                } else {
                    window.location.href = url;
                }
            };

            // ===== UI Helpers =====
            function showLoading() {
                els.loading.classList.remove('hidden');
                els.error.classList.add('hidden');
                els.twoColumn.classList.add('hidden');
            }

            function showError(message) {
                els.loading.classList.add('hidden');
                els.error.classList.remove('hidden');
                els.twoColumn.classList.add('hidden');
                els.errorText.textContent = message || '加载失败';
            }

            function escapeHtml(str) {
                if (typeof str !== 'string') return str;
                return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
            }

            // ===== Init =====
            document.addEventListener('DOMContentLoaded', loadData);
        })();
    </script>
</body>
</html>
