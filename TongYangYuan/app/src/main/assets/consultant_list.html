<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>咨询师推荐</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 分类标签 */
        .consultant-tabs {
            display: flex;
            gap: 8px;
            padding: 16px 16px 12px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .consultant-tabs::-webkit-scrollbar {
            display: none;
        }

        .consultant-tab {
            padding: 10px 20px;
            border-radius: 999px;
            background: white;
            border: 1.5px solid #BDEBC8;
            font-size: 14px;
            font-weight: 500;
            color: #6FA6F8;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .consultant-tab.active {
            background: linear-gradient(135deg, #6FA6F8 0%, #A9C9FF 100%);
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 12px rgba(111, 166, 248, 0.4);
        }

        .consultant-tab .tab-count {
            display: inline-block;
            margin-left: 6px;
            padding: 2px 8px;
            background: rgba(111, 166, 248, 0.12);
            border-radius: 999px;
            font-size: 12px;
        }

        .consultant-tab.active .tab-count {
            background: rgba(255,255,255,0.25);
        }

        /* 统计信息 */
        .consultant-stats {
            display: flex;
            gap: 12px;
            padding: 16px;
            margin: 0 16px 12px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(111, 166, 248, 0.12);
        }

        .consultant-stat-item {
            flex: 1;
            text-align: center;
            padding: 8px 0;
        }

        .consultant-stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #6FA6F8;
        }

        .consultant-stat-label {
            font-size: 12px;
            color: #999;
            margin-top: 2px;
        }

        /* 列表区域 */
        .consultant-list-container {
            padding: 0 16px 100px;
        }

        /* 咨询师卡片 */
        .consultant-card {
            background: white;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 16px rgba(111, 166, 248, 0.12);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .consultant-card:active {
            transform: scale(0.98);
        }

        .consultant-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #6FA6F8, #A9C9FF);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .consultant-card:hover::before {
            opacity: 1;
        }

        .consultant-card-header {
            display: flex;
            gap: 14px;
            margin-bottom: 14px;
        }

        .consultant-avatar {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            background: linear-gradient(135deg, #6FA6F8 0%, #A9C9FF 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            box-shadow: 0 6px 16px rgba(111, 166, 248, 0.25);
            position: relative;
        }

        .consultant-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .consultant-avatar-initial {
            font-size: 28px;
            font-weight: 700;
            color: white;
        }

        .consultant-avatar-badge {
            position: absolute;
            bottom: -4px;
            right: -4px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
            border: 2px solid white;
        }

        .consultant-avatar-badge.yellow-v {
            background: linear-gradient(135deg, #FFD54F 0%, #FFC107 100%);
        }

        .consultant-avatar-badge.blue-v {
            background: linear-gradient(135deg, #64B5F6 0%, #42A5F5 100%);
        }

        .consultant-card-info {
            flex: 1;
            min-width: 0;
        }

        .consultant-name-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .consultant-name {
            font-size: 18px;
            font-weight: 700;
            color: #6FA6F8;
        }

        .consultant-identity-tag {
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
        }

        .consultant-identity-tag.yellow-v {
            background: linear-gradient(135deg, #FFF8E1 0%, #FFECB3 100%);
            color: #F57C00;
        }

        .consultant-identity-tag.blue-v {
            background: linear-gradient(135deg, #E3F2FD 0%, #BBDEFB 100%);
            color: #1976D2;
        }

        .consultant-title {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }

        .consultant-rating-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .consultant-rating {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .consultant-star {
            width: 16px;
            height: 16px;
            fill: #FFD54F;
        }

        .consultant-rating-value {
            font-size: 15px;
            font-weight: 700;
            color: #E65100;
        }

        .consultant-served {
            font-size: 12px;
            color: #999;
        }

        .consultant-specialty {
            padding: 12px;
            background: rgba(111, 166, 248, 0.06);
            border-radius: 12px;
            margin-bottom: 14px;
        }

        .consultant-specialty-label {
            font-size: 11px;
            color: #6FA6F8;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .consultant-specialty-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .consultant-specialty-tag {
            padding: 4px 12px;
            background: white;
            border-radius: 999px;
            font-size: 12px;
            color: #6FA6F8;
            border: 1px solid rgba(111, 166, 248, 0.2);
        }

        /* 筛选条件横幅 */
        .filter-banner {
            display: none;
            margin: 0 16px 12px;
            padding: 12px 16px;
            background: linear-gradient(135deg, #E3F2FD 0%, #BBDEFB 100%);
            border-radius: 16px;
            border: 1px solid rgba(111, 166, 248, 0.2);
        }

        .filter-banner.active {
            display: block;
        }

        .filter-banner-title {
            font-size: 14px;
            font-weight: 600;
            color: #1976D2;
            margin-bottom: 6px;
        }

        .filter-banner-tags {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .filter-banner-tag {
            padding: 4px 12px;
            background: white;
            border-radius: 999px;
            font-size: 12px;
            color: #6FA6F8;
            border: 1px solid rgba(111, 166, 248, 0.3);
        }

        .filter-clear-btn {
            padding: 4px 12px;
            background: #6FA6F8;
            border: none;
            border-radius: 999px;
            font-size: 12px;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-clear-btn:active {
            transform: scale(0.96);
            background: #5A95E8;
        }

        .consultant-card-footer {
            display: flex;
            gap: 10px;
        }

        .consultant-btn {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .consultant-btn.primary {
            background: linear-gradient(135deg, #6FA6F8 0%, #A9C9FF 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(111, 166, 248, 0.35);
        }

        .consultant-btn.primary:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(111, 166, 248, 0.25);
        }

        .consultant-btn.secondary {
            background: rgba(111, 166, 248, 0.1);
            color: #6FA6F8;
        }

        /* 空状态 */
        .consultant-empty {
            text-align: center;
            padding: 60px 24px;
        }

        .consultant-empty-icon {
            font-size: 72px;
            margin-bottom: 20px;
        }

        .consultant-empty h3 {
            font-size: 18px;
            color: #333;
            margin: 0 0 8px;
        }

        .consultant-empty p {
            font-size: 14px;
            color: #999;
            margin: 0;
        }

        /* 内容区域 */
        .content {
            padding: 0 !important;
            padding-bottom: 80px !important;
        }
    </style>
</head>
<body>
    <div class="top-app-bar glass">
        <button class="back-btn" onclick="goBack()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 18l-6-6 6-6"/>
            </svg>
        </button>
        <div class="title">咨询师推荐</div>
    </div>

    <div class="content">
        <!-- 分类标签 -->
        <div class="consultant-tabs" id="consultantTabs">
            <button class="consultant-tab active" data-filter="all" onclick="filterConsultants('all')">
                全部<span class="tab-count" id="countAll">0</span>
            </button>
        </div>

        <!-- 筛选条件横幅 -->
        <div class="filter-banner" id="filterBanner">
            <div class="filter-banner-title" id="filterBannerTitle">筛选条件</div>
            <div class="filter-banner-tags" id="filterBannerTags"></div>
        </div>

        <!-- 统计信息 -->
        <div class="consultant-stats">
            <div class="consultant-stat-item">
                <div class="consultant-stat-value" id="totalCount">0</div>
                <div class="consultant-stat-label">入驻咨询师</div>
            </div>
            <div class="consultant-stat-item">
                <div class="consultant-stat-value" id="avgRating">0</div>
                <div class="consultant-stat-label">平均评分</div>
            </div>
            <div class="consultant-stat-item">
                <div class="consultant-stat-value" id="totalServed">0</div>
                <div class="consultant-stat-label">服务家庭</div>
            </div>
        </div>

        <!-- 咨询师列表 -->
        <div class="consultant-list-container">
            <div id="consultantsList">
                <!-- 咨询师卡片将动态生成 -->
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        function escapeHtml(text) {
            if (text === undefined || text === null) return '';
            return String(text)
                .replace(/&/g, '&')
                .replace(/</g, '<')
                .replace(/>/g, '>')
                .replace(/"/g, '"')
                .replace(/'/g, '&#39;');
        }

        function escapeAttr(value) {
            if (value === undefined || value === null) return '';
            return String(value)
                .replace(/&/g, '&')
                .replace(/"/g, '"')
                .replace(/</g, '<')
                .replace(/>/g, '>');
        }

        function escapeForJsString(value) {
            if (value === undefined || value === null) return '';
            return String(value)
                .replace(/\\/g, '\\\\')
                .replace(/'/g, '\\\'');
        }

        let allConsultants = [];
        let currentFilter = 'all';

        // 读取URL参数
        const urlParams = new URLSearchParams(window.location.search);
        const categoryCode = urlParams.get('category');
        const tagIds = urlParams.get('tags'); // comma-separated tag IDs
        const stageCodes = urlParams.get('stage'); // comma-separated stage codes
        const stageNames = urlParams.get('stageName'); // comma-separated stage names

        // 人生阶段标签配置（从stage code映射到显示名称）
        const stageLabelMap = {
            'newborn': '0-1岁',
            'infant': '1-2岁',
            'kindergarten': '3-6岁',
            'primary_school': '7-12岁',
            'middle_high_school': '13-18岁',
            'college': '大学生',
            'society': '步入社会',
            'marriage': '婚前婚后',
            'property_division': '分家财产',
            'elderly_care': '养老赡养'
        };

        function getAvatarColor(consultant) {
            return 'linear-gradient(135deg, #6FA6F8 0%, #A9C9FF 100%)';
        }

        function renderAvatar(consultant) {
            const color = getAvatarColor(consultant);
            const initial = consultant.name ? consultant.name.charAt(0) : '咨';
            const photo = consultant.avatarUrl;
            
            let avatarContent;
            if (photo) {
                avatarContent = `<img src="${escapeAttr(photo)}" alt="${escapeAttr(consultant.name)}">`;
            } else {
                avatarContent = `<span class="consultant-avatar-initial">${escapeHtml(initial)}</span>`;
            }

            return `
                <div class="consultant-avatar" style="background: ${color};">
                    ${avatarContent}
                </div>
            `;
        }

        // 缓存咨询师标签
        const consultantTagsCache = {};

        async function loadConsultantTags(consultantId) {
            if (consultantTagsCache[consultantId]) {
                return consultantTagsCache[consultantId];
            }
            try {
                const baseUrl = window.API_BASE_URL || 'http://127.0.0.1:8080/api';
                const res = await fetch(baseUrl + '/consultants/' + consultantId + '/specialties');
                const result = await res.json();
                let data = result;
                if (result && typeof result === 'object' && 'data' in result && 'code' in result) {
                    data = result.data;
                }
                const tags = Array.isArray(data) ? data : [];
                consultantTagsCache[consultantId] = tags;
                return tags;
            } catch (e) {
                console.error('加载咨询师标签失败:', e);
                return [];
            }
        }

        function renderConsultantCard(consultant) {
            const safeName = escapeHtml(consultant.name || '咨询师');
            const safeTitle = escapeHtml(consultant.title || '');
            const safeOnclickName = escapeForJsString(consultant.name || '');
            const rating = Number(consultant.rating || 0).toFixed(1);
            const served = consultant.servedCount || consultant.served || 0;
            const consultantId = consultant.id;
            
            // 从stages数组渲染擅长阶段标签（支持对象数组或字符串数组）
            const stages = consultant.stages || [];
            const stageTagsHtml = stages.length > 0 
                ? stages.map(s => {
                    const stageName = (typeof s === 'object' ? (s.name || s.code || '') : s);
                    return `<span class="consultant-specialty-tag">${escapeHtml(stageName)}</span>`;
                }).join('')
                : '<span class="consultant-specialty-tag" style="background:#f0f0f0;color:#999;">暂无</span>';

            return `
                <div class="consultant-card" data-consultant-id="${consultantId}" onclick="viewDetail('${safeOnclickName}')">
                    <div class="consultant-card-header">
                        ${renderAvatar(consultant)}
                        <div class="consultant-card-info">
                            <div class="consultant-name-row">
                                <span class="consultant-name">${safeName}</span>
                            </div>
                            <div class="consultant-title">${safeTitle}</div>
                            <div class="consultant-rating-row">
                                <div class="consultant-rating">
                                    <svg class="consultant-star" viewBox="0 0 24 24">
                                        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                                    </svg>
                                    <span class="consultant-rating-value">${rating}</span>
                                </div>
                                <span class="consultant-served">已服务 ${served}+ 家庭</span>
                            </div>
                        </div>
                    </div>
                    <div class="consultant-specialty">
                        <div class="consultant-specialty-label">擅长阶段</div>
                        <div class="consultant-specialty-tags">${stageTagsHtml}</div>
                    </div>
                    <div class="consultant-card-footer">
                        <button class="consultant-btn primary" onclick="event.stopPropagation(); bookConsultant('${safeOnclickName}')">立即预约</button>
                        <button class="consultant-btn secondary" onclick="event.stopPropagation(); viewDetail('${safeOnclickName}')">查看详情</button>
                    </div>
                </div>
            `;
        }

        async function fillConsultantTags(consultants) {
            // 现在stages直接内联在卡片中渲染，此函数保留用于向后兼容
            // 不再异步加载 specialties，而是直接使用 consultant.stages
        }

        function filterConsultants(filter) {
            currentFilter = filter;
            
            document.querySelectorAll('.consultant-tab').forEach(tab => {
                tab.classList.remove('active');
                if (tab.dataset.filter === filter) {
                    tab.classList.add('active');
                }
            });

            let filtered = allConsultants;
            if (filter !== 'all') {
                // 按人生阶段筛选：检查consultant.stages中是否包含该阶段
                filtered = allConsultants.filter(c => {
                    const stages = c.stages || [];
                    return stages.some(s => {
                        const stageCode = (typeof s === 'object' ? (s.code || '') : s);
                        const stageName = (typeof s === 'object' ? (s.name || '') : s);
                        return stageCode === filter || stageName === filter || stageName === stageLabelMap[filter];
                    });
                });
            }

            renderConsultantsList(filtered);
        }

        function renderConsultantsList(consultants) {
            const list = document.getElementById('consultantsList');

            if (!consultants || consultants.length === 0) {
                list.innerHTML = `
                    <div class="consultant-empty">
                        <div class="consultant-empty-icon">🔍</div>
                        <h3>暂无符合条件的咨询师</h3>
                        <p>换个筛选条件试试吧</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = consultants.map(c => renderConsultantCard(c)).join('');
            // 异步加载每个咨询师的标签
            fillConsultantTags(consultants);
        }

        function sortConsultants(consultants) {
            return [...consultants].sort((a, b) => {
                return (b.rating ?? 0) - (a.rating ?? 0);
            });
        }

        function updateStats() {
            const totalServed = allConsultants.reduce((sum, c) => sum + (c.servedCount || c.served || 0), 0);
            const avgRating = allConsultants.length > 0 
                ? (allConsultants.reduce((sum, c) => sum + (c.rating || 0), 0) / allConsultants.length).toFixed(1)
                : '0';

            document.getElementById('countAll').textContent = allConsultants.length;
            document.getElementById('totalCount').textContent = allConsultants.length;
            document.getElementById('avgRating').textContent = avgRating;
            document.getElementById('totalServed').textContent = totalServed;
        }

        // 动态生成人生阶段筛选标签
        function renderStageTabs() {
            const tabsContainer = document.getElementById('consultantTabs');
            if (!tabsContainer) return;
            
            // 收集所有咨询师的人生阶段
            const stageSet = new Set();
            allConsultants.forEach(c => {
                const stages = c.stages || [];
                stages.forEach(s => {
                    const code = typeof s === 'object' ? (s.code || '') : s;
                    const name = typeof s === 'object' ? (s.name || '') : s;
                    if (code) stageSet.add(JSON.stringify({code, name: name || stageLabelMap[code] || code}));
                });
            });
            
            const stages = Array.from(stageSet).map(s => JSON.parse(s));
            // 按预设顺序排序
            const stageOrder = Object.keys(stageLabelMap);
            stages.sort((a, b) => {
                const idxA = stageOrder.indexOf(a.code);
                const idxB = stageOrder.indexOf(b.code);
                if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                if (idxA !== -1) return -1;
                if (idxB !== -1) return 1;
                return a.name.localeCompare(b.name);
            });
            
            // 保留"全部"标签，添加阶段标签
            let tabsHtml = `
                <button class="consultant-tab active" data-filter="all" onclick="filterConsultants('all')">
                    全部<span class="tab-count" id="countAll">0</span>
                </button>
            `;
            stages.forEach(stage => {
                const label = stageLabelMap[stage.code] || stage.name || stage.code;
                tabsHtml += `
                    <button class="consultant-tab" data-filter="${escapeAttr(stage.code)}" onclick="filterConsultants('${escapeAttr(stage.code)}')">
                        ${escapeHtml(label)}
                    </button>
                `;
            });
            tabsContainer.innerHTML = tabsHtml;
            
            // 恢复当前筛选状态
            if (currentFilter !== 'all') {
                document.querySelectorAll('.consultant-tab').forEach(tab => {
                    tab.classList.toggle('active', tab.dataset.filter === currentFilter);
                });
            }
        }

        function showFilterBanner() {
            const banner = document.getElementById('filterBanner');
            const titleEl = document.getElementById('filterBannerTitle');
            const tagsEl = document.getElementById('filterBannerTags');

            if (!categoryCode && !tagIds) {
                banner.classList.remove('active');
                return;
            }

            let titleText = '筛选条件';
            if (categoryCode) {
                titleText = '筛选条件: ' + escapeHtml(categoryCode);
            }
            titleEl.textContent = titleText;

            let tagsHtml = '';
            if (tagIds) {
                const tags = tagIds.split(',').map(t => t.trim()).filter(t => t);
                if (tags.length > 0) {
                    tagsHtml += '<span style="font-size:12px;color:#666;margin-right:4px;">已选标签:</span>';
                    tags.forEach(tag => {
                        tagsHtml += `<span class="filter-banner-tag">${escapeHtml(tag)}</span>`;
                    });
                }
            }
            tagsHtml += `<button class="filter-clear-btn" onclick="clearFilters()">清除筛选</button>`;
            tagsEl.innerHTML = tagsHtml;

            banner.classList.add('active');
        }

        function clearFilters() {
            const url = new URL(window.location.href);
            url.searchParams.delete('category');
            url.searchParams.delete('tags');
            window.location.href = url.toString();
        }

        function loadConsultants() {
            const hasFilters = categoryCode || tagIds || stageCodes;

            if (hasFilters) {
                // 有过滤条件时，使用fetch API从服务器获取
                loadConsultantsFromApi(categoryCode, tagIds);
                return;
            }

            // 无过滤条件时，先尝试从本地获取
            let localLoaded = false;
            if (window.Android && Android.getConsultants) {
                try {
                    const json = Android.getConsultants();
                    const parsed = JSON.parse(json);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        allConsultants = parsed;
                        localLoaded = true;
                        console.log('[Local] 咨询师数据加载成功:', allConsultants.length);
                    } else {
                        console.log('[Local] 本地咨询师数据为空');
                    }
                } catch (e) {
                    console.error('[Local] 加载本地咨询师数据失败', e);
                }
            }

            // 如果本地没有数据，自动从API获取
            if (!localLoaded || allConsultants.length === 0) {
                console.log('[Fallback] 本地无数据，尝试从API获取');
                loadConsultantsFromApi(null, null);
                return;
            }

            allConsultants = sortConsultants(allConsultants);
            updateStats();
            renderStageTabs();
            filterConsultants(currentFilter);
        }

        function loadConsultantsFromApi(category, tags) {
            let apiUrl = '/consultants';
            const params = new URLSearchParams();
            if (category) params.append('category', category);
            if (tags) params.append('tags', tags);
            params.append('sort', 'priority');
            if (params.toString()) apiUrl += '?' + params.toString();

            const fullApiUrl = (window.API_BASE_URL || 'http://127.0.0.1:8080/api') + apiUrl;
            console.log('[API] fullApiUrl:', fullApiUrl);
            fetch(fullApiUrl)
                .then(res => {
                    console.log('[API] Response status:', res.status);
                    return res.json();
                })
                .then(result => {
                    console.log('[API] Response:', result);
                    let data = result;
                    // Handle ApiResponse wrapper {code, message, data}
                    if (result && typeof result === 'object' && 'data' in result && 'code' in result) {
                        data = result.data;
                    }
                    if (Array.isArray(data) && data.length) {
                        allConsultants = data;
                    } else {
                        allConsultants = [];
                    }
                    console.log('[API] Consultants loaded:', allConsultants.length);
                    allConsultants = sortConsultants(allConsultants);
                    updateStats();
                    filterConsultants(currentFilter);
                })
                .catch(err => {
                    console.error('[API] 加载咨询师数据失败', err);
                    allConsultants = [];
                    updateStats();
                    filterConsultants(currentFilter);
                });
        }

        function viewDetail(name) {
            if (window.Android && Android.navigateToConsultantDetail) {
                Android.navigateToConsultantDetail(name);
            } else {
                showToast(`查看 ${name} 的详情`);
            }
        }

        function bookConsultant(name) {
            if (window.Android && Android.navigateToAppointment) {
                Android.navigateToAppointment(name);
            } else {
                showToast(`预约 ${name} 咨询师`);
            }
        }

        function goBack() {
            if (window.Android && Android.goBack) {
                Android.goBack();
            } else {
                window.history.back();
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            showFilterBanner();
            loadConsultants();
        });
    </script>
</body>
</html>
